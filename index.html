<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#173A63" />
  <meta name="description" content="J-StarX US Healthcare Breakthrough Program - Foundational Course companion app" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="planex-favicon.png" type="image/png" />
  <link rel="stylesheet" href="styles.css?v=7.13" />
  <title>J-StarX US Healthcare Breakthrough Program - Foundational Course</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="topbar-brand-block">
        <div class="topbar-program">
          <img src="jstarx-logo.png" alt="J-StarX" class="topbar-jstarx-logo">
          <div class="topbar-program-name">J-StarX US Healthcare Breakthrough Program - Foundational Course</div>
        </div>
        <h1 id="pageTitle">Home</h1>
      </div>
      <div class="top-actions"><span id="syncBadge" class="sync-badge local">Local Demo</span><button id="roleBadge" class="role-badge" title="Account / role">Participant</button></div>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <footer class="brand-footer"><img src="planex-logo.png" alt="PlanEx Business Partners LLC" class="planex-mark"><span>Program Companion by PlanEx Business Partners LLC · © 2026 PlanEx Business Partners LLC. All rights reserved.</span></footer>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-route="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-route="schedule" class="nav-item"><span>▣</span><small>Schedule</small></button>
      <button data-route="challenge" class="nav-item"><span>◆</span><small>Challenge</small></button>
      <button data-route="people" class="nav-item"><span>◉</span><small>People</small></button>
      <button data-route="messages" class="nav-item"><span>✉</span><small>Messages</small><b id="messageBadge" class="badge hidden">0</b></button>
      <button data-route="more" class="nav-item"><span>☰</span><small>More</small></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <button id="modalClose" class="modal-close" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="config.js?v=7.13"></script>
  <script src="cloud.js?v=7.13"></script>
  <script src="app.js?v=7.13" defer></script>
</body>
</html>
